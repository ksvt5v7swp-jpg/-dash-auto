name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd proj && gradle assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} proj/app/build/outputs/apk/debug/app-debug.apk --title "Dash Auto v${{ github.run_number }}" --notes "APK à installer sur l'autoradio"
